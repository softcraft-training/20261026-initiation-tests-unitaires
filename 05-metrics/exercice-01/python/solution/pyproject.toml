[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.sonar]
projectKey = "gilded-rose-python"
projectName = "Gilded Rose (Python)"
host.url = "http://localhost:9000"
sources = "src"
tests = "tests"
python.version = "3.12"
python.coverage.reportPaths = "coverage.xml"
